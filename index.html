<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lớp Học AI Tự Động</title>
    <!-- Thêm thư viện Puter.js -->
    <script src="https://js.puter.com/v2/"></script>
</head>
<body>

    <h1>🎓 Chào Mừng Đến Với Lớp Học AI!</h1>
    <p>Trang web này sẽ giúp bạn học AI hoàn toàn tự động!</p>

    <!-- Thêm nút kiểm tra xem Puter.js hoạt động hay chưa -->
    <button onclick="testPuter()">Kiểm Tra Puter.js</button>
    <p id="status"></p>

    <script>
        function testPuter() {
            if (typeof Puter !== "undefined") {
                document.getElementById("status").innerText = "✅ Puter.js đã sẵn sàng!";
            } else {
                document.getElementById("status").innerText = "❌ Lỗi: Puter.js chưa hoạt động!";
            }
        }
    </script>

</body>
</html>
<script src="script.js"></script>
